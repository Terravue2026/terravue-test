<!DOCTYPE html>
<html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terravue</title>
<style>body{font-family:sans-serif;padding:16px;max-width:480px;margin:auto}input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}input[type=checkbox]{width:auto;margin-right:8px}label{display:block;margin:6px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#eee;color:#111;padding:8px}</style></head>
<body>
<h2>Terravue – Test koneksyon</h2>
<div id="login">
<input id="e" type="email" placeholder="Imèl" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
<input id="p" type="password" placeholder="Modpas" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password">
<label><input id="show" type="checkbox">Montre modpas la</label>
<button id="go">Konekte</button>
</div>
<div id="app" style="display:none">
<p id="who"></p>
<button id="out">Dekonekte</button>
</div>
<pre id="log"></pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://wldkqvhmwodjwuetvizw.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZGtxdmhtd29kand1ZXR2aXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2Njg1MzYsImV4cCI6MjEwOTI0NDUzNn0.TG1fniYudCOKuyZLWILBlqpLYfZkzCwELAxnW9qkzF0';
const sb=window.supabase.createClient(URL_,KEY);
const $=id=>document.getElementById(id);
const log=t=>{$('log').textContent+=t+'\n'};
async function test(){
  $('log').textContent='';
  for(const t of ['user_profiles','communes']){
    const {data,error}=await sb.from(t).select('*').limit(3);
    log(t+': '+(error?'ERÈ '+error.message:data.length+' liy'));
  }
}
function show(s){
  $('login').style.display=s?'none':'block';
  $('app').style.display=s?'block':'none';
  if(s){$('who').textContent='Konekte: '+s.user.email;test();}
}
$('show').onchange=()=>{$('p').type=$('show').checked?'text':'password'};
$('go').onclick=async()=>{
  $('log').textContent='Ap konekte...';
  try{
    const {error}=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});
    if(error)$('log').textContent='ERÈ: '+error.message;
    else $('p').value='';
  }catch(x){$('log').textContent='ERÈ REZO: '+x.message;}
};
$('out').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_ev,s)=>show(s));
sb.auth.getSession().then(r=>show(r.data.session));
</script>
</body></html>
