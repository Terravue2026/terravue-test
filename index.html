<!DOCTYPE html>
<html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terravue Dyagnostik</title>
<style>body{font-family:sans-serif;padding:16px;max-width:480px;margin:auto}input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#eee;color:#111;padding:8px}</style></head>
<body>
<h2>Terravue – Dyagnostik</h2>
<div id="login">
<input id="e" type="text" placeholder="Imèl" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">
<input id="p" type="text" placeholder="Modpas (vizib)" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">
<button id="go">Konekte</button>
</div>
<div id="app" style="display:none">
<p id="who"></p>
<button id="out">Dekonekte</button>
</div>
<pre id="log"></pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://wldkqvhmwodjwuetvizw.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZGtxdmhtd29kand1ZXR2aXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2Njg1MzYsImV4cCI6MjEwOTI0NDUzNn0.TG1fniYudCOKuyZLWILBlqpLYfZkzCwELAxnW9qkzF0';
const sb=window.supabase.createClient(URL_,KEY);
const $=id=>document.getElementById(id);
const log=t=>{$('log').textContent+=t+'\n'};
async function test(){
  for(const t of ['user_profiles','communes']){
    const {data,error}=await sb.from(t).select('*').limit(3);
    log(t+': '+(error?'ERÈ '+error.message:data.length+' liy\n'+JSON.stringify(data,null,1)));
  }
}
function show(s){
  $('login').style.display=s?'none':'block';
  $('app').style.display=s?'block':'none';
  if(s){$('who').textContent='Konekte: '+s.user.email;test();}
}
$('go').onclick=async()=>{
  const email=$('e').value;
  const password=$('p').value;
  $('log').textContent='Pwojè: '+URL_+'\n'
    +'Imèl ['+email+'] = '+email.length+' karaktè\n'
    +'Modpas ['+password+'] = '+password.length+' karaktè\nAp konekte...\n';
  try{
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:password});
    if(error)log('ERÈ: '+error.message+' | status='+error.status+' | code='+(error.code||''));
  }catch(x){log('ERÈ REZO: '+x.message);}
};
$('out').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_ev,s)=>show(s));
sb.auth.getSession().then(r=>show(r.data.session));
</script>
</body></html>
